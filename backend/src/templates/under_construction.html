<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Under Construction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827" />
  <style>
    :root {
      --bg: #0b0f19;
      --fg: #e5e7eb;
      --muted: #9ca3af;
      --card: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.18);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      --radius: 16px;

      /* Rainbow palette */
      --r1: #ff4d4d;  /* red */
      --r2: #ff922b;  /* orange */
      --r3: #ffd43b;  /* yellow */
      --r4: #51cf66;  /* green */
      --r5: #339af0;  /* blue */
      --r6: #845ef7;  /* indigo */
      --r7: #e64980;  /* violet */
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--fg);
      background: var(--bg);
      font: 500 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell,
        Noto Sans, Helvetica Neue, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated rainbow background */
    body::before {
      content: "";
      position: fixed;
      inset: -15% -15% -15% -15%;
      background: conic-gradient(from 0deg,
        var(--r1), var(--r2), var(--r3), var(--r4), var(--r5), var(--r6), var(--r7), var(--r1)
      );
      filter: blur(60px) saturate(120%);
      opacity: 0.5;
      animation: spin 30s linear infinite;
      z-index: -2;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(1200px 800px at 20% -10%, rgba(255,255,255,0.12), transparent 60%),
                  radial-gradient(1200px 800px at 100% 0%, rgba(255,255,255,0.08), transparent 60%),
                  linear-gradient(180deg, rgba(0,0,0,0.5), rgba(0,0,0,0.6));
      z-index: -1;
    }

    .wrapper {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 6vw 4vw;
    }

    .card {
      width: min(960px, 100%);
      background: var(--card);
      backdrop-filter: blur(18px) saturate(120%);
      -webkit-backdrop-filter: blur(18px) saturate(120%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(20px, 4vw, 42px);
      text-align: center;
    }

    h1 {
      margin: 14px 0 8px;
      font-size: clamp(36px, 6vw, 72px);
      line-height: 1.05;
      font-weight: 800;
      background: linear-gradient(90deg, var(--r1), var(--r2), var(--r3), var(--r4), var(--r5), var(--r6), var(--r7));
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shift 14s ease-in-out infinite;
    }

    .message {
      color: var(--muted);
      font-size: clamp(16px, 2.2vw, 22px);
      margin-bottom: 2rem;
    }

    .cta {
      appearance: none;
      cursor: pointer;
      border: 0;
      border-radius: 14px;
      padding: 14px 22px;
      font-weight: 700;
      font-size: 16px;
      color: #0b0f19;
      background:
        linear-gradient(white, white) padding-box,
        linear-gradient(90deg, var(--r1), var(--r2), var(--r3), var(--r4), var(--r5), var(--r6), var(--r7)) border-box;
      border: 2px solid transparent;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
      transition: transform 200ms ease, box-shadow 200ms ease, background 400ms ease;
      text-decoration: none;
      display: inline-block;
    }
    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.4);
    }
    .cta:active {
      transform: translateY(0);
      box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    }

        .promo-container {
      margin: 2rem 0;
      display: flex;
      justify-content: center;
    }
    
    .promo-container img {
      max-width: 100%;
      height: auto;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: transform 200ms ease;
    }
    
    .promo-container img:hover {
      transform: scale(1.02);
    }
    
    @media (max-width: 768px) {
      .promo-container img {
        max-width: 90%;
      }
    }
    
    @media (max-width: 480px) {
      .promo-container img {
        max-width: 85%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
      h1 { animation: none; }
      .cta { transition: none; }
    }

    @keyframes spin { to { transform: rotate(1turn); } }
    @keyframes shift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  </style>
</head>
<body>
  <main class="wrapper">
    <section class="card">
      <h1>Under Construction</h1>
      <div>
        <p class="message">We're building something awesome. Please check back soon.</p>
        <div class="promo-container">
          <img src="https://i.imgur.com/guVjzVn.png" referrerpolicy="no-referrer" alt="img">
        </div>
        <a href="{{ url_for('main.index') }}" class="cta">← Back to Home</a>
      </div>
    </section>
  </main>
</body>
</html>
