databases:
  - name: agile-postgres
    databaseName: agile_db
    plan: free
    region: frankfurt

services:
  - type: web
    name: flask-backend
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agile-postgres
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          name: react-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: MATCH_THRESHOLD
        value: "0.25"
      - key: MATCH_COUNT
        value: "8"

  - type: web
    name: react-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: flask-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
