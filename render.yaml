databases:
  - name: agile-postgres
    databaseName: agile_db
    plan: free
    region: frankfurt

services:
  - type: web
    name: flask-backend
    env: docker
    plan: free
    region: frankfurt
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agile-postgres
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          name: react-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: react-frontend
    env: static
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: flask-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL