databases:
  - name: agile-postgres
    databaseName: agile_db
    user: postgres
    plan: free
    region: frankfurt

services:
  - type: web
    name: flask-backend
    env: docker
    plan: free
    region: frankfurt
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agile-postgres
          property: connectionString

  - type: web
    name: react-frontend
    env: docker
    plan: free
    region: frankfurt
    rootDir: frontend
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          name: flask-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
